name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install dependencies
      working-directory: ./services/control-plane
      run: go mod tidy

    - name: Build
      working-directory: ./services/control-plane
      run: go build -v ./...

    - name: Test
      working-directory: ./services/control-plane
      run: go test -v ./...
