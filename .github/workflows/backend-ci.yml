name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Install dependencies
      working-directory: ./services/control-plane
      run: go mod tidy

    - name: Build
      working-directory: ./services/control-plane
      run: go build -v ./...

    - name: Test
      working-directory: ./services/control-plane
      env:
        DATABASE_URL: postgres://atlas:atlas@localhost:5432/nexus?sslmode=disable
      run: go test -v ./...
