name: Docker Build

on:
  push:
    branches: [ "main" ]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Backend Docker Image
        run: docker build -t nexus-backend -f deployments/docker/Dockerfile.control-plane .
      - name: Build Frontend Docker Image
        run: docker build -t nexus-frontend -f deployments/docker/Dockerfile.dashboard .
      - name: Build AI Docker Image
        run: docker build -t nexus-ai -f deployments/docker/Dockerfile.intelligence .
