apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: nexus
spec:
  podSelector:
    matchLabels:
      app: nexus-backend
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nexus-frontend
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-db
  namespace: nexus
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nexus-backend
      ports:
        - protocol: TCP
          port: 5432
