apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-ai
  namespace: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-ai
  template:
    metadata:
      labels:
        app: nexus-ai
    spec:
      containers:
        - name: ai
          image: docker-intelligence:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-ai
  namespace: nexus
spec:
  selector:
    app: nexus-ai
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
