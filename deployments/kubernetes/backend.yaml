apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-backend
  namespace: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-backend
  template:
    metadata:
      labels:
        app: nexus-backend
    spec:
      containers:
        - name: backend
          image: docker-control-plane:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: "postgres://atlas:atlas@postgres:5432/nexus?sslmode=disable"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-backend
  namespace: nexus
spec:
  selector:
    app: nexus-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
